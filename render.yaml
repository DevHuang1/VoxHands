services:
  - type: web
    name: voxhands
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements-render.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false