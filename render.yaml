services:
  - type: web
    name: voxhands
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Headless container: MuJoCo renders offscreen through EGL. The libraries
      # are installed in the Dockerfile; this selects the backend.
      - key: MUJOCO_GL
        value: egl
      - key: GROQ_API_KEY
        sync: false
